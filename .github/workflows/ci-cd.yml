name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------
  # 1. Frontend - type-check + build
  # -------------------------------------------
  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # -------------------------------------------
  # 2. Backend - build + test
  # -------------------------------------------
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: backend

  # -------------------------------------------
  # 3. Deploy - only on push to main, only if both jobs pass
  # -------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger backend deploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}")
          echo "Render backend deploy triggered - HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "Failed to trigger backend deploy"
            exit 1
          fi

      - name: Trigger frontend deploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}")
          echo "Render frontend deploy triggered - HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "Failed to trigger frontend deploy"
            exit 1
          fi

      - name: Wait for backend to come up
        run: sleep 90

      - name: Health check - backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_BACKEND_URL }}/health")
          echo "Backend health check - HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed - backend may not have started correctly"
            exit 1
          fi
          echo "Backend healthy"
