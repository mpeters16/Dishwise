services:
  - type: web
    name: frontend
    env: docker
    repo: https://github.com/mpeters16/RecipeManager
    dockerfilePath: ./frontend/Dockerfile
    autoDeploy: false
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: backend
          property: hostport
      - key: BACKEND_URL
        fromService:
          type: web
          name: backend
          property: hostport

  - type: web
    name: backend
    env: docker
    repo: https://github.com/mpeters16/RecipeManager
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeploy: false
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: frontend
          property: hostport
      - key: Jwt__Issuer
        value: RecipeManagerApi
      - key: Jwt__Audience
        value: RecipeManagerApiUsers
      - key: Jwt__Key
        value: ${JWT_KEY}
      - key: ConnectionStrings__DefaultConnection
        value: ${DATABASE_CONNECTION_STRING}
